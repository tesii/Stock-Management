<div class="ip-page">

  <!-- LEFT PANEL — Form -->
  <div class="ip-left">

    <div class="ip-brand">
<img class="ip-logo-img" src="assets\images\insta-logo.jpg" alt="Instaplus logo" width="100" height="20" />
     
    </div>

    <h2 class="ip-heading">Sign In</h2>
    <div class="ip-underline"></div>
    <p class="ip-sub">Access your stock management dashboard</p>

    <!-- USERNAME -->
    <div class="ip-field">
      <label class="ip-label">Username</label>
      <div class="ip-inp-wrap">
        <input
          class="ip-input"
          type="text"
          placeholder="Enter your username"
          [(ngModel)]="username"
          name="username"
        />
        <i class="ti ti-user ip-inp-icon" aria-hidden="true"></i>
        <div class="ip-inp-border"></div>
      </div>
    </div>

    <!-- PASSWORD -->
    <div class="ip-field">
      <label class="ip-label">Password</label>
      <div class="ip-inp-wrap">
        <input
          class="ip-input"
          type="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
        />
        <i class="ti ti-lock ip-inp-icon" aria-hidden="true"></i>
        <div class="ip-inp-border"></div>
      </div>
    </div>

    <!-- OPTIONS -->
    <div class="ip-opt-row">
      <label class="ip-chk-label">
        <input type="checkbox" class="ip-chk" />
        Remember me
      </label>
      <a class="ip-forgot" routerLink="/forgot-password">Forgot password?</a>
    </div>

    <!-- BUTTON -->
    <button class="ip-btn" (click)="login()" [disabled]="isSubmitting">
      <div class="ip-btn-sweep"></div>
      <div class="ip-btn-inner">
        <i class="ti ti-login" aria-hidden="true" *ngIf="!isSubmitting"></i>
        <span *ngIf="!isSubmitting">Login</span>
        <span *ngIf="isSubmitting">Authenticating...</span>
      </div>
    </button>

    <!-- ERROR -->
    <p class="ip-error" *ngIf="error">{{ error }}</p>

    <!-- FOOTER -->
    <div class="ip-foot">
      New to Instaplus? <a routerLink="/register">Create account</a>
    </div>
  </div>

  <!-- RIGHT PANEL — Welcome -->
  <div class="ip-right">
    <div class="ip-rp-glow"></div>
    <div class="ip-rp-glow2"></div>

    <div class="ip-rp-content">

      <h3 class="ip-rp-heading">Already<br>with us?</h3>
      <p class="ip-rp-desc">Sign in to manage inventory, track stock levels and monitor orders in real time.</p>

      <button class="ip-rp-btn" routerLink="/register">New here? Register →</button>

      <p class="ip-rp-live">
        <span class="ip-dot"></span>
        System live · All services operational
      </p>
    </div>
  </div>

</div>
