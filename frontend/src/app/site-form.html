<div class="site-form-container">

    <div class="form-header">
        <h2>{{ isEdit ? 'Update Site' : 'Add New Site' }}</h2>
        <p class="form-subtitle">{{ isEdit ? 'Update site details' : 'Register a new site location' }}</p>
    </div>

    <form (ngSubmit)="saveSite()">

        <div class="form-body">

            <div class="form-group">
                <label>Site Name</label>
                <input
                    type="text"
                    name="siteName"
                    [(ngModel)]="site.siteName"
                    placeholder="Enter site name"
                    required>
            </div>

            <div class="form-group">
                <label>Contact Person</label>
                <input
                    type="text"
                    name="contactPerson"
                    [(ngModel)]="site.contactPerson"
                    placeholder="Enter contact person">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input
                        type="text"
                        name="phone"
                        [(ngModel)]="site.phone"
                        placeholder="e.g. 078xxxxxxx">
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input
                        type="text"
                        name="address"
                        [(ngModel)]="site.address"
                        placeholder="Enter address">
                </div>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        name="active"
                        [(ngModel)]="site.active">
                    <span class="checkbox-custom"></span>
                    Active Site
                </label>
            </div>

            <div class="buttons">

                <button type="submit" class="save-btn">
                    {{ isEdit ? 'Update Site' : 'Save Site' }}
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    (click)="goBack()">
                    Cancel
                </button>

            </div>

        </div>

    </form>

</div>
