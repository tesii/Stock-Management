<div class="container">

  <h2>📦 Pending Stock Approvals</h2>

  <table border="1" width="100%" cellpadding="10">

    <thead>
      <tr>
        <th>Item</th>
        <th>Type</th>
        <th>Quantity</th>
        <th>Site</th>
        <th>Date</th>
        <th>Note</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let m of paginatedPending">

        <td>{{ getItemName(m.itemId) }}</td>
        <td>{{ m.type }}</td>
        <td>{{ m.quantity }}</td>
        <td>{{ m.site?.siteName || '—' }}</td>
        <td>{{ m.date }}</td>
        <td>{{ m.note }}</td>

        <td>{{ m.status }}</td>

        <td>
          <button (click)="approve(m.id!)">Approve</button>
          <button (click)="reject(m.id!)" style="background:red;color:white;">
            Reject
          </button>
        </td>

      </tr>

      <tr *ngIf="pending.length === 0">
        <td colspan="7" style="text-align:center; color:#94a3b8; font-style:italic;">
          No pending approvals
        </td>
      </tr>

    </tbody>

  </table>

  <!-- PAGINATION -->
  <div class="pagination" *ngIf="pending.length > pageSize">

    <button (click)="prevPage()" [disabled]="currentPage === 1">
      ◀ Previous
    </button>

    <span>
      Page {{ currentPage }} / {{ totalPages }}
    </span>

    <button (click)="nextPage()" [disabled]="currentPage === totalPages">
      Next ▶
    </button>

  </div>

</div>
