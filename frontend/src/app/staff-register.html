<div class="auth-page register-page">

  <!-- LEFT PANEL -->
  <section class="auth-panel animated-card">
    <div class="panel-top">

      <h1>Create your store profile</h1>
      <p>
        Join the team and start managing stock, approvals, and operations in one system.
      </p>
    </div>

   
  </section>

  <!-- RIGHT FORM -->
  <section class="form-card animated-card">

    <!-- HEADER -->
    <div class="form-header">
              <img src="assets/images/insta-logo.jpg" alt="InstaPlus Services Ltd" class="panel-logo" width="120" height="10"  />

    
    </div>

    <!-- USERNAME -->
    <div class="field-group">
      <label>Username</label>
      <input
        class="input"
        type="text"
        [(ngModel)]="user.username"
        name="username"
        placeholder="Enter username"
      />
    </div>

    <!-- PASSWORD -->
    <div class="field-group">
      <label>Password</label>
     <input
  class="input"
  type="password"
  [(ngModel)]="user.password"
  name="password"
  placeholder="Enter password"
  (input)="checkPassword($event.target.value)"
/>
    </div>

    <!-- MESSAGE (ERROR / WARNING / SUCCESS) -->
    <p
      class="msg"
      *ngIf="message"
      [ngClass]="messageType"
    >
      {{ message }}
    </p>

    <!-- ROLE -->
    <div class="field-group">
      <label>Role</label>
      <select
        class="input"
        [(ngModel)]="user.role"
        name="role"
      >
        <option value="STORE_KEEPER">Store Keeper</option>
        <option value="MANAGER">Manager</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <!-- SUBMIT BUTTON -->
    <button
      class="primary-btn"
      (click)="register()"
      [disabled]="isSubmitting"
    >
      {{ isSubmitting ? 'Creating account...' : 'Create Account' }}
    </button>

    <!-- LOGIN LINK -->
    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>

  </section>

</div>
