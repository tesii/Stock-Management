<div class="user-form">
  <div class="form-header">
    <div class="form-icon">👤</div>
    <h3>{{ id ? 'Edit User' : 'New User' }}</h3>
    <p class="form-subtitle">{{ id ? 'Update account details' : 'Create a new system account' }}</p>
  </div>

  <div class="form-body">
    <div class="field-group">
      <label>Username</label>
      <input [(ngModel)]="username" placeholder="Enter username" />
    </div>

    <div class="field-group" *ngIf="!id">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" placeholder="Enter password" />
    </div>

    <div class="field-group">
      <label>Role</label>
      <select [(ngModel)]="role">
        <option value="STORE_KEEPER">Store Keeper</option>
        <option value="MANAGER">Manager</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <div class="form-actions">
      <button class="save-btn" (click)="save()">Save</button>
      <a class="cancel-link" routerLink="/users">Cancel</a>
    </div>
  </div>
</div>
