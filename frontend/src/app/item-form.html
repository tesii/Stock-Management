<div class="form-container">
 <button type="button" class="back-btn" (click)="goBack()">
  ← Back to Dashboard
</button>
  <div class="form-header">
    <h2>Add Item</h2>
    <p class="form-subtitle">Register a new item into inventory</p>
  </div>

  <form (ngSubmit)="saveItem()">

    <div class="field-group">
      <label>Name</label>
      <input [(ngModel)]="item.name" name="name" placeholder="e.g. Cement 50kg bag">
    </div>

    <div class="field-row">
     <div class="field-group">
  <label>Quantity</label>
  <input 
    type="number" 
    min="0"
    [(ngModel)]="item.quantity" 
    name="quantity" 
    placeholder="0">
</div>

      <div class="field-group">
        <label>Unit</label>
        <input [(ngModel)]="item.unit" name="unit" placeholder="e.g. bags, litres">
      </div>
    </div>

    <div class="field-row">
     <div class="field-group">
  <label>Unit Price</label>
  <input 
    type="number" 
    min="0"
    [(ngModel)]="item.unitPrice" 
    name="unitPrice" 
    placeholder="0.00">
</div>
      <!-- ✅ NEW FIELD -->
      <div class="field-group">
        <label>Min Stock Level</label>
        <input 
          type="number" 
          min="0"
          [(ngModel)]="item.minStockLevel" 
          name="minStockLevel" 
          placeholder="0">
      </div>
    </div>

    <button type="submit" class="save-btn">Save Item</button>

  </form>
</div>
